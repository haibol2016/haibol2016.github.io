translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-A1-0" transform="translate(138, 35)"><rect class="basic label-container" style="fill:#9C27B0 !important;stroke:#4A148C !important;stroke-width:3px !important" x="-81.2578125" y="-27" width="162.515625" height="54"/><g class="label" style="color:#fff !important;font-weight:bold !important" transform="translate(-51.2578125, -12)"><rect/><foreignObject width="102.515625" height="24"><div style="color: rgb(255, 255, 255) !important; font-weight: bold !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important;font-weight:bold !important" class="nodeLabel"><p>combine(ch2)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-A2-1" transform="translate(138, 295)"><rect class="basic label-container" style="fill:#F3E5F5 !important;stroke:#4A148C !important;stroke-width:2px !important" x="-130" y="-159" width="260" height="318"/><g class="label" style="" transform="translate(-100, -144)"><rect/><foreignObject width="200" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Input: ch1=['A','B'], ch2=[1,2,3]<br />Pairs items as they arrive (streaming)<br />Output: [['A',1], ['A',2], ['A',3], ['B',1], ['B',2], ['B',3]]<br />Note: Each item from ch1 pairs with ALL items from ch2<br />KEY: Works with multiple channels, supports 'by' option for custom pairing</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B1-2" transform="translate(448, 35)"><rect class="basic label-container" style="fill:#BA68C8 !important;stroke:#4A148C !important;stroke-width:3px !important" x="-63.96875" y="-27" width="127.9375" height="54"/><g class="label" style="color:#fff !important;font-weight:bold !important" transform="translate(-33.96875, -12)"><rect/><foreignObject width="67.9375" height="24"><div style="color: rgb(255, 255, 255) !important; font-weight: bold !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important;font-weight:bold !important" class="nodeLabel"><p>join(ch2)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B2-3" transform="translate(448, 295)"><rect class="basic label-container" style="fill:#F3E5F5 !important;stroke:#4A148C !important;stroke-width:2px !important" x="-130" y="-183" width="260" height="366"/><g class="label" style="" transform="translate(-100, -168)"><rect/><foreignObject width="200" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Input: ch1=[['sample1', 'file1.fq'], ['sample2', 'file2.fq']],<br />ch2=[['sample1', 'ref1.fa'], ['sample2', 'ref2.fa'], ['sample3', 'ref3.fa']]<br />Joins by matching first element (key)<br />Output: [['sample1', 'file1.fq', 'ref1.fa'], ['sample2', 'file2.fq', 'ref2.fa']]<br />Note: 'sample3' dropped (no match in ch1)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C1-4" transform="translate(758, 35)"><rect class="basic label-container" style="fill:#CE93D8 !important;stroke:#4A148C !important;stroke-width:3px !important" x="-91.7734375" y="-27" width="183.546875" height="54"/><g class="label" style="color:#000 !important;font-weight:bold !important" transform="translate(-61.7734375, -12)"><rect/><foreignObject width="123.546875" height="24"><div style="color: rgb(0, 0, 0) !important; font-weight: bold !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important;font-weight:bold !important" class="nodeLabel"><p>merge(ch2, ch3)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C2-5" transform="translate(758, 295)"><rect class="basic label-container" style="fill:#F3E5F5 !important;stroke:#4A148C !important;stroke-width:2px !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Input: ch1=['A','B'], ch2=['X','Y'], ch3=['1']<br />Interleaves items as they arrive<br />Output: ['A', 'X', '1', 'B', 'Y'] (order may vary)<br />Note: Non-deterministic interleaving, preserves all items</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D1-6" transform="translate(1068, 35)"><rect class="basic label-container" style="fill:#E1BEE7 !important;stroke:#4A148C !important;stroke-width:3px !important" x="-74.2734375" y="-27" width="148.546875" height="54"/><g class="label" style="color:#000 !important;font-weight:bold !important" transform="translate(-44.2734375, -12)"><rect/><foreignObject width="88.546875" height="24"><div style="color: rgb(0, 0, 0) !important; font-weight: bold !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important;font-weight:bold !important" class="nodeLabel"><p>concat(ch2)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D2-7" transform="translate(1068, 295)"><rect class="basic label-container" style="fill:#F3E5F5 !important;stroke:#4A148C !important;stroke-width:2px !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Input: ch1=['A','B','C'], ch2=['X','Y']<br />Sequential concatenation<br />Output: ['A', 'B', 'C', 'X', 'Y']<br />Note: All ch1 items first, then all ch2 items</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E1-8" transform="translate(1378, 35)"><rect class="basic label-container" style="fill:#9C27B0 !important;stroke:#4A148C !important;stroke-width:3px !important" x="-63.078125" y="-27" width="126.15625" height="54"/><g class="label" style="color:#fff !important;font-weight:bold !important" transform="translate(-33.078125, -12)"><rect/><foreignObject width="66.15625" height="24"><div style="color: rgb(255, 255, 255) !important; font-weight: bold !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important;font-weight:bold !important" class="nodeLabel"><p>mix(ch2)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E2-9" transform="translate(1378, 295)"><rect class="basic label-container" style="fill:#F3E5F5 !important;stroke:#4A148C !important;stroke-width:2px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Input: ch1=['A','B'], ch2=['X','Y']<br />Randomly mixes items<br />Output: ['A', 'Y', 'B', 'X'] (random order)<br />Note: Random interleaving, all items preserved</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F1-10" transform="translate(1688, 35)"><rect class="basic label-container" style="fill:#BA68C8 !important;stroke:#4A148C !important;stroke-width:3px !important" x="-68.328125" y="-27" width="136.65625" height="54"/><g class="label" style="color:#fff !important;font-weight:bold !important" transform="translate(-38.328125, -12)"><rect/><foreignObject width="76.65625" height="24"><div style="color: rgb(255, 255, 255) !important; font-weight: bold !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important;font-weight:bold !important" class="nodeLabel"><p>cross(ch2)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F2-11" transform="translate(1688, 295)"><rect class="basic label-container" style="fill:#F3E5F5 !important;stroke:#4A148C !important;stroke-width:2px !important" x="-130" y="-171" width="260" height="342"/><g class="label" style="" transform="translate(-100, -156)"><rect/><foreignObject width="200" height="312"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Input: ch1=['A','B'], ch2=[1,2,3]<br />Cartesian product (collects ALL items first)<br />Output: [['A',1], ['A',2], ['A',3], ['B',1], ['B',2], ['B',3]]<br />Note: DIFFERENT from combine: Must collect all items from both channels before creating combinations. Cannot use 'by' option. Only works with 2 channels.</p></span></div></foreignObject></g></g></g></g></g></svg>