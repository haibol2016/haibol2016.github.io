<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0366d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28a745;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- DNA double helix representation -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
  <path d="M 30 30 Q 50 20, 70 30 Q 50 40, 30 30" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M 30 70 Q 50 60, 70 70 Q 50 80, 30 70" stroke="#fff" stroke-width="2" fill="none"/>
  <circle cx="35" cy="35" r="3" fill="#fff"/>
  <circle cx="65" cy="35" r="3" fill="#fff"/>
  <circle cx="35" cy="65" r="3" fill="#fff"/>
  <circle cx="65" cy="65" r="3" fill="#fff"/>
  <!-- Data visualization bars -->
  <rect x="20" y="45" width="4" height="10" fill="#fff" opacity="0.8"/>
  <rect x="26" y="42" width="4" height="16" fill="#fff" opacity="0.8"/>
  <rect x="70" y="45" width="4" height="10" fill="#fff" opacity="0.8"/>
  <rect x="76" y="42" width="4" height="16" fill="#fff" opacity="0.8"/>
</svg>

